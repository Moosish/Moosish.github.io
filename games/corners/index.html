<!DOCTYPE html>
<html lang="en">
<head>
    <title>Corner Streak — Games — Thomas Pasley</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/fontawesome-all.min.css"/>
    <link rel="stylesheet" href="../../assets/css/redesign.css"/>
    <style>
        .game-page { padding: 5rem 1rem 3rem; }
        .game-wrap { max-width: 840px; margin: 0 auto; }

        .game-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
        .game-breadcrumb { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.2rem; }
        .game-breadcrumb a { color: var(--text-muted); text-decoration: none; }
        .game-breadcrumb a:hover { color: var(--primary-light); }
        .game-title { font-size: 1.5rem; font-weight: 700; color: var(--text-primary); margin: 0; }

        .streak-bar { display: flex; gap: 1.5rem; font-size: 0.875rem; color: var(--text-muted); }
        .streak-bar span { display: flex; align-items: center; gap: 0.35rem; }
        .streak-bar b { font-size: 1.1rem; font-weight: 700; }
        #streak-now { color: var(--primary-light); }
        #streak-best-val { color: var(--accent); }

        /* Canvas sits flush with the panel below it */
        .canvas-wrap {
            width: 100%;
            background: #0c2918;
            border-radius: 12px 12px 0 0;
            overflow: hidden;
            border: 1px solid rgba(148,163,184,0.1);
            border-bottom: none;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }
        #gc { display: block; width: 100%; height: auto; }

        /* Timing meter — HTML element below canvas */
        .meter-outer {
            display: none;
            background: #0e0e0e;
            border-left: 1px solid rgba(148,163,184,0.1);
            border-right: 1px solid rgba(148,163,184,0.1);
            padding: 0.65rem 1rem 0.55rem;
        }
        .meter-outer.visible { display: block; }
        .meter-track {
            position: relative;
            height: 28px;
            border-radius: 14px;
            overflow: hidden;
            background: linear-gradient(to right,
                #ef4444 0%, #f59e0b 20%, #a3e635 36%,
                #34d399 50%, #a3e635 64%, #f59e0b 80%, #ef4444 100%);
            border: 1px solid rgba(255,255,255,0.07);
            cursor: pointer;
        }
        .meter-sweet {
            position: absolute; top: 0; height: 100%;
            left: 36%; width: 28%;
            background: rgba(255,255,255,0.11);
            pointer-events: none;
        }
        .meter-needle {
            position: absolute; top: -3px; bottom: -3px; width: 5px;
            background: #fff; border-radius: 3px;
            box-shadow: 0 0 10px rgba(255,255,255,0.85);
            transform: translateX(-50%);
            left: 50%;
            pointer-events: none;
        }
        .meter-hint {
            font-size: 0.7rem; color: var(--text-muted);
            text-align: center; margin: 0.35rem 0 0;
            font-family: inherit;
        }

        /* Result strip */
        .result-strip {
            background: #0e0e0e;
            border-left: 1px solid rgba(148,163,184,0.1);
            border-right: 1px solid rgba(148,163,184,0.1);
            padding: 0.45rem 1rem;
            min-height: 2.1rem;
            display: flex; align-items: center; justify-content: center;
        }
        .result-strip p {
            margin: 0; font-size: 0.82rem; font-weight: 600;
            text-align: center; color: transparent;
        }
        .result-strip p.goal { color: var(--primary-light); }
        .result-strip p.miss { color: #f87171; }

        /* Controls panel — bottom of the card */
        .controls {
            display: flex; gap: 0.75rem 1.25rem; flex-wrap: wrap; align-items: flex-start;
            background: #111;
            border: 1px solid rgba(148,163,184,0.1);
            border-top: 1px solid rgba(148,163,184,0.06);
            border-radius: 0 0 12px 12px;
            padding: 0.875rem 1rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        }
        .ctrl-group { display: flex; flex-direction: column; gap: 0.35rem; }
        .ctrl-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); }
        .btn-row { display: flex; gap: 0.3rem; flex-wrap: wrap; }
        .ctrl-btn {
            padding: 0.32rem 0.65rem;
            border-radius: 6px;
            border: 1px solid rgba(148,163,184,0.12);
            background: rgba(26,26,26,0.9);
            color: var(--text-secondary);
            font-family: inherit; font-size: 0.78rem; font-weight: 500;
            cursor: pointer; transition: all 0.15s; white-space: nowrap;
        }
        .ctrl-btn:hover { border-color: var(--primary); color: var(--primary-light); }
        .ctrl-btn.active { background: rgba(16,185,129,0.15); border-color: var(--primary); color: var(--primary-light); }

        .ctrl-action { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 0.4rem; }
        #action-btn {
            padding: 0.5rem 1.4rem; border-radius: 8px; border: none;
            background: var(--primary); color: #fff;
            font-family: inherit; font-size: 0.875rem; font-weight: 600;
            cursor: pointer; transition: background 0.15s; min-width: 130px;
        }
        #action-btn:hover:not(:disabled) { background: var(--primary-dark); }
        #action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #reset-btn {
            background: none; border: none; font-family: inherit;
            font-size: 0.72rem; color: var(--text-muted);
            cursor: pointer; padding: 0;
            text-decoration: underline; text-underline-offset: 2px;
        }
        #reset-btn:hover { color: var(--text-secondary); }

        @media (max-width: 600px) {
            .ctrl-action { margin-left: 0; align-items: flex-start; }
            #action-btn { min-width: unset; }
        }
    </style>
</head>
<body>

<nav id="main-nav">
    <div class="nav-container">
        <div class="nav-brand">
            <span class="brand-icon">TP</span>
            <span class="brand-name">Thomas Pasley</span>
        </div>
        <div class="nav-menu" id="navMenu">
            <a href="/" class="nav-link">Portfolio</a>
            <a href="/blog/" class="nav-link">Blog</a>
            <a href="/games/" class="nav-link active">Games</a>
        </div>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
    </div>
</nav>

<main class="game-page">
    <div class="game-wrap">
        <header class="game-header">
            <div>
                <p class="game-breadcrumb"><a href="/games/">Games</a> / Corner Streak</p>
                <h1 class="game-title">Corner Streak</h1>
            </div>
            <div class="streak-bar">
                <span>Streak <b id="streak-now">0</b></span>
                <span>Best <b id="streak-best-val">0</b></span>
            </div>
        </header>

        <div class="canvas-wrap">
            <canvas id="gc" width="800" height="400"></canvas>
        </div>

        <div id="meter-outer" class="meter-outer">
            <div class="meter-track" id="meter-track">
                <div class="meter-sweet"></div>
                <div id="meter-needle" class="meter-needle"></div>
            </div>
            <p class="meter-hint">Click &nbsp;·&nbsp; Space &nbsp;·&nbsp; Tap &nbsp;to take the corner</p>
        </div>

        <div class="result-strip">
            <p id="result-msg">&nbsp;</p>
        </div>

        <div class="controls">
            <div class="ctrl-group">
                <span class="ctrl-label">Corner Type</span>
                <div class="btn-row" id="type-btns">
                    <button class="ctrl-btn active" data-type="inswinger">Inswinger</button>
                    <button class="ctrl-btn" data-type="outswinger">Outswinger</button>
                    <button class="ctrl-btn" data-type="nearpost">Near Post</button>
                    <button class="ctrl-btn" data-type="driven">Driven</button>
                </div>
            </div>
            <div class="ctrl-group">
                <span class="ctrl-label">Power</span>
                <div class="btn-row" id="power-btns">
                    <button class="ctrl-btn" data-power="low">Low</button>
                    <button class="ctrl-btn active" data-power="medium">Medium</button>
                    <button class="ctrl-btn" data-power="high">High</button>
                </div>
            </div>
            <div class="ctrl-group">
                <span class="ctrl-label">Side</span>
                <div class="btn-row" id="side-btns">
                    <button class="ctrl-btn" data-side="left">Left</button>
                    <button class="ctrl-btn active" data-side="right">Right</button>
                </div>
            </div>
            <div class="ctrl-action">
                <button id="action-btn">Take Corner</button>
                <button id="reset-btn">Reset positions</button>
            </div>
        </div>
    </div>
</main>

<script>
(function () {
    'use strict';

    var CW = 800, CH = 400;

    // Pitch geometry — 1 m ≈ 17 px
    var SCALE = 17;
    var PA_W = Math.round(40.32 * SCALE);          // 685  penalty-area width
    var PA_H = Math.round(16.5  * SCALE);          // 281  penalty-area depth
    var PA_X = Math.round((CW - PA_W) / 2);        //  58  left edge
    var PA_Y = 44;                                 //       goal-line y
    var SB_W = Math.round(18.32 * SCALE);          // 312  six-yard box width
    var SB_H = Math.round(5.5   * SCALE);          //  94  six-yard box depth
    var SB_X = PA_X + Math.round((PA_W - SB_W) / 2);
    var GW   = Math.round(7.32  * SCALE);          // 124  goal width
    var G_X  = PA_X + Math.round((PA_W - GW) / 2);
    var PS_D = Math.round(11    * SCALE);          // 187  penalty-spot depth
    var D_R  = Math.round(10    * SCALE);          // 170  D-arc radius
    var CR   = Math.round(1     * SCALE);          //  17  corner-arc radius

    // Colour helpers
    function rgba(hex, a) {
        var r = parseInt(hex.slice(1,3), 16);
        var g = parseInt(hex.slice(3,5), 16);
        var b = parseInt(hex.slice(5,7), 16);
        return 'rgba('+r+','+g+','+b+','+a+')';
    }
    var EM = '#34d399', BL = '#60a5fa', AM = '#f59e0b', RE = '#f87171', VI = '#a78bfa';

    // Zones — weights differ for left-side corners (np ↔ bp swapped)
    var ZONES = [
        { id:'np', name:'Near Post',
          x: G_X + 20,         y: PA_Y + 18,          r: 44,
          wR:{ inswinger:0.58, outswinger:0.07, nearpost:0.65, driven:0.06 },
          wL:{ inswinger:0.07, outswinger:0.58, nearpost:0.06, driven:0.06 },
          p: { low:1.12, medium:1.0, high:0.65 } },
        { id:'6y', name:'6-Yard',
          x: PA_X + PA_W/2,    y: PA_Y + SB_H * 0.55, r: 52,
          wR:{ inswinger:0.42, outswinger:0.20, nearpost:0.30, driven:0.14 },
          wL:{ inswinger:0.42, outswinger:0.20, nearpost:0.30, driven:0.14 },
          p: { low:1.0, medium:1.05, high:0.82 } },
        { id:'ps', name:'Pen. Spot',
          x: PA_X + PA_W/2,    y: PA_Y + PS_D,         r: 56,
          wR:{ inswinger:0.18, outswinger:0.26, nearpost:0.10, driven:0.50 },
          wL:{ inswinger:0.18, outswinger:0.26, nearpost:0.10, driven:0.50 },
          p: { low:0.55, medium:1.0, high:1.15 } },
        { id:'bp', name:'Back Post',
          x: G_X + GW - 20,    y: PA_Y + 18,           r: 44,
          wR:{ inswinger:0.07, outswinger:0.58, nearpost:0.06, driven:0.14 },
          wL:{ inswinger:0.58, outswinger:0.07, nearpost:0.65, driven:0.14 },
          p: { low:0.50, medium:0.95, high:1.20 } },
        { id:'eb', name:'Edge',
          x: PA_X + PA_W/2,    y: PA_Y + PA_H - 28,    r: 50,
          wR:{ inswinger:0.06, outswinger:0.10, nearpost:0.04, driven:0.44 },
          wL:{ inswinger:0.06, outswinger:0.10, nearpost:0.04, driven:0.44 },
          p: { low:0.30, medium:0.85, high:1.25 } },
    ];

    // One defender per zone (5 total)
    var DEF_BASE = [
        { x: G_X + 8,          y: PA_Y + 5,            zone: 'np' },
        { x: G_X + GW - 8,     y: PA_Y + 5,            zone: 'bp' },
        { x: SB_X + 80,        y: PA_Y + SB_H * 0.6,   zone: '6y' },
        { x: PA_X + PA_W/2,    y: PA_Y + PS_D,          zone: 'ps' },
        { x: PA_X + PA_W/2,    y: PA_Y + PA_H - 28,     zone: 'eb' },
    ];
    function randomizeDef() {
        return DEF_BASE.map(function(b) {
            var sx = b.x + (Math.random() - 0.5) * 24;
            var sy = b.y + (Math.random() - 0.5) * 18;
            return { x:sx, y:sy, tx:sx, ty:sy, zone:b.zone };
        });
    }
    var DEF = randomizeDef();

    var ATT_COLS = [EM, BL, AM, RE, VI];
    function defaultAttackers() {
        return [
            { x: G_X + 20,        y: PA_Y + 18,          col: ATT_COLS[0] },
            { x: PA_X + PA_W/2,   y: PA_Y + SB_H * 0.55, col: ATT_COLS[1] },
            { x: PA_X + PA_W/2,   y: PA_Y + PS_D,         col: ATT_COLS[2] },
            { x: G_X + GW - 20,   y: PA_Y + 18,           col: ATT_COLS[3] },
            { x: PA_X + PA_W/2,   y: PA_Y + PA_H - 28,    col: ATT_COLS[4] },
        ];
    }

    // ── State ────────────────────────────────────────────────────────────────
    var phase      = 'setup';
    var ctype      = 'inswinger';
    var power      = 'medium';
    var side       = 'right';
    var streak     = 0;
    var best       = 0;
    var attackers  = defaultAttackers();
    var drag       = null;
    var meter      = { val:0.5, dir:1, spd:0.012, locked:false, quality:0 };
    var ball       = null;
    var animT      = 0;
    var resultGoal = false;
    var qualLabel  = { text:'', alpha:0, col:EM };
    var zoneFlash  = { id:null, alpha:0 };

    // ── Canvas setup (DPR-aware) ──────────────────────────────────────────────
    var canvas = document.getElementById('gc');
    var ctx    = canvas.getContext('2d');
    var dpr    = window.devicePixelRatio || 1;
    canvas.width  = CW * dpr;
    canvas.height = CH * dpr;
    ctx.scale(dpr, dpr);

    function cornerPos() {
        return side === 'right'
            ? { x: PA_X + PA_W, y: PA_Y }
            : { x: PA_X,        y: PA_Y };
    }

    // ── Drawing ───────────────────────────────────────────────────────────────

    function drawPitch() {
        var cp = cornerPos();

        ctx.fillStyle = '#081a10';
        ctx.fillRect(0, 0, CW, PA_Y);
        ctx.fillStyle = '#0c2918';
        ctx.fillRect(0, PA_Y, CW, CH - PA_Y);

        for (var s = 0; s < 6; s++) {
            if (s % 2 === 0) {
                ctx.fillStyle = 'rgba(255,255,255,0.016)';
                ctx.fillRect(PA_X, PA_Y + (PA_H/6)*s, PA_W, PA_H/6);
            }
        }

        // Net
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        ctx.fillRect(G_X, PA_Y - 22, GW, 22);
        ctx.strokeStyle = 'rgba(255,255,255,0.09)'; ctx.lineWidth = 0.5;
        for (var nx = G_X + 10; nx < G_X + GW; nx += 10) {
            ctx.beginPath(); ctx.moveTo(nx, PA_Y-22); ctx.lineTo(nx, PA_Y); ctx.stroke();
        }
        for (var ny = PA_Y-7; ny > PA_Y-22; ny -= 7) {
            ctx.beginPath(); ctx.moveTo(G_X, ny); ctx.lineTo(G_X+GW, ny); ctx.stroke();
        }

        // Goal posts
        ctx.strokeStyle = 'rgba(255,255,255,0.92)'; ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(G_X, PA_Y); ctx.lineTo(G_X, PA_Y-22);
        ctx.lineTo(G_X+GW, PA_Y-22); ctx.lineTo(G_X+GW, PA_Y);
        ctx.stroke();

        // Pitch lines
        ctx.strokeStyle = 'rgba(255,255,255,0.68)'; ctx.lineWidth = 1.5;
        ctx.strokeRect(PA_X, PA_Y, PA_W, PA_H);
        ctx.strokeRect(SB_X, PA_Y, SB_W, SB_H);

        // Penalty spot
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.beginPath(); ctx.arc(PA_X+PA_W/2, PA_Y+PS_D, 3.5, 0, Math.PI*2); ctx.fill();

        // D arc
        var dInt = Math.asin((PA_H - PS_D) / D_R);
        ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(PA_X+PA_W/2, PA_Y+PS_D, D_R, dInt, Math.PI-dInt, false);
        ctx.stroke();

        // Corner arc
        ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        if (side === 'right') ctx.arc(cp.x, cp.y, CR, Math.PI/2, Math.PI, false);
        else                  ctx.arc(cp.x, cp.y, CR, 0, Math.PI/2, false);
        ctx.stroke();

        // Corner flag
        var fd = side === 'right' ? -1 : 1;
        ctx.strokeStyle = AM; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cp.x, cp.y); ctx.lineTo(cp.x, cp.y+18); ctx.stroke();
        ctx.fillStyle = AM;
        ctx.beginPath();
        ctx.moveTo(cp.x, cp.y+18);
        ctx.lineTo(cp.x + fd*11, cp.y+12);
        ctx.lineTo(cp.x, cp.y+6);
        ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.arc(cp.x, cp.y, 4, 0, Math.PI*2); ctx.fill();
    }

    function zoneW(z) { return (side === 'right' ? z.wR : z.wL)[ctype]; }

    function zoneColour(z) {
        var w = zoneW(z);
        if (w >= 0.35) return EM;
        if (w >= 0.15) return AM;
        return '#64748b';
    }

    function drawZones() {
        ctx.save();
        for (var i = 0; i < ZONES.length; i++) {
            var z = ZONES[i];
            var col = zoneColour(z);
            var hasAtt = attackers.some(function(a) { return Math.hypot(a.x-z.x, a.y-z.y) < z.r+6; });
            var isFlash = zoneFlash.id === z.id && zoneFlash.alpha > 0;
            var alpha = isFlash ? Math.max(0.25, zoneFlash.alpha * 0.45) : (hasAtt ? 0.20 : 0.08);
            var strokeA = isFlash ? Math.min(1, zoneFlash.alpha * 0.9) : (hasAtt ? 0.40 : 0.18);
            var flashCol = isFlash ? (resultGoal ? EM : RE) : col;

            ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI*2);
            ctx.fillStyle = rgba(flashCol, alpha); ctx.fill();
            ctx.strokeStyle = rgba(flashCol, strokeA);
            ctx.lineWidth = isFlash ? 2.5 : 1; ctx.stroke();

            ctx.font = '9px Inter, sans-serif';
            ctx.fillStyle = rgba(flashCol, isFlash ? 1 : (hasAtt ? 0.90 : 0.42));
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(z.name, z.x, z.y);
        }
        ctx.textBaseline = 'alphabetic';
        ctx.restore();
    }

    function drawDefenders() {
        ctx.save();
        for (var i = 0; i < DEF.length; i++) {
            var d = DEF[i];
            ctx.beginPath(); ctx.arc(d.x, d.y, 11, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(248,113,113,0.14)'; ctx.fill();
            ctx.strokeStyle = RE; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.font = 'bold 8px Inter, sans-serif';
            ctx.fillStyle = RE; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('D', d.x, d.y);
        }
        ctx.textBaseline = 'alphabetic';
        ctx.restore();
    }

    function drawAttackers() {
        ctx.save();
        for (var i = 0; i < attackers.length; i++) {
            var a = attackers[i];
            var isDrag = drag && drag.idx === i;
            var r = isDrag ? 15 : 12;
            if (isDrag) { ctx.shadowColor = a.col; ctx.shadowBlur = 14; }
            ctx.beginPath(); ctx.arc(a.x, a.y, r, 0, Math.PI*2);
            ctx.fillStyle = rgba(a.col, isDrag ? 0.25 : 0.18); ctx.fill();
            ctx.strokeStyle = a.col; ctx.lineWidth = isDrag ? 2.5 : 2; ctx.stroke();
            ctx.font = 'bold '+(isDrag?10:9)+'px Inter, sans-serif';
            ctx.fillStyle = a.col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(String(i+1), a.x, a.y);
            ctx.shadowBlur = 0;
        }
        ctx.textBaseline = 'alphabetic';
        ctx.restore();
    }

    function drawBall() {
        if (!ball) return;
        var prog = ball.t / ball.dur;
        var h = Math.sin(Math.pow(prog, 0.6) * Math.PI); // peaks early, descends into box
        if (h > 0.05) {
            ctx.beginPath();
            ctx.ellipse(ball.x+h*4, ball.y+h*8, (5+h*3)*1.4, (5+h*3)*0.6, 0, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(0,0,0,'+(0.28*h)+')'; ctx.fill();
        }
        for (var t = 0; t < ball.trail.length; t++) {
            var pt = ball.trail[t];
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 2+(t/ball.trail.length)*3, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255,255,255,'+(t/ball.trail.length)*0.30+')';
            ctx.fill();
        }
        var br = 5 + h*4;
        ctx.shadowColor = 'rgba(255,255,255,0.45)'; ctx.shadowBlur = h*10;
        ctx.beginPath(); ctx.arc(ball.x, ball.y, br, 0, Math.PI*2);
        ctx.fillStyle = '#fff'; ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 1; ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.arc(ball.x, ball.y, br*0.44, 0, Math.PI*2); ctx.stroke();
    }

    function drawQualLabel() {
        if (qualLabel.alpha <= 0) return;
        qualLabel.alpha -= 0.020;
        var cp = cornerPos();
        var lx = side === 'right' ? cp.x - 80 : cp.x + 80;
        ctx.globalAlpha = Math.max(0, qualLabel.alpha);
        ctx.font = 'bold 20px Inter, sans-serif';
        ctx.fillStyle = qualLabel.col;
        ctx.textAlign = 'center';
        ctx.shadowColor = qualLabel.col; ctx.shadowBlur = 12;
        ctx.fillText(qualLabel.text, lx, cp.y + 55);
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }

    function drawResult() {
        if (phase !== 'goal_anim' && phase !== 'miss_anim') return;
        animT++;
        var t = Math.min(animT / 40, 1);
        if (phase === 'goal_anim') {
            ctx.fillStyle = rgba(EM, 0.28 * Math.abs(Math.sin(animT * 0.22)));
            ctx.fillRect(G_X-8, PA_Y-26, GW+16, 30);
            var sc = Math.min(t * 1.9, 1);
            ctx.save();
            ctx.translate(CW/2, CH/2 - 50); ctx.scale(sc, sc);
            ctx.font = 'bold 62px Inter, sans-serif';
            ctx.fillStyle = rgba(EM, Math.min(t*2.5, 1));
            ctx.textAlign = 'center';
            ctx.shadowColor = EM; ctx.shadowBlur = 26;
            ctx.fillText('GOAL!', 0, 0);
            ctx.shadowBlur = 0;
            ctx.font = '18px Inter, sans-serif';
            ctx.fillStyle = rgba('#cbd5e1', Math.min(t*2.5, 1));
            ctx.fillText('Streak: '+streak, 0, 36);
            ctx.restore();
        } else {
            var fa = Math.max(0, Math.min(t*3,1) * (1 - Math.max(0, t-0.65)*2.9));
            ctx.font = 'bold 46px Inter, sans-serif';
            ctx.fillStyle = rgba(RE, fa);
            ctx.textAlign = 'center';
            ctx.shadowColor = RE; ctx.shadowBlur = 16;
            ctx.fillText('CLEARED!', CW/2, CH/2 - 20);
            ctx.shadowBlur = 0;
            ctx.font = '15px Inter, sans-serif';
            ctx.fillStyle = rgba('#94a3b8', fa);
            ctx.fillText('Streak reset', CW/2, CH/2 + 8);
        }
    }

    function drawHints() {
        if (phase !== 'setup') return;
        ctx.font = '11px Inter, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillStyle = 'rgba(148,163,184,0.55)';
        ctx.fillText('Drag players to position them', PA_X+4, CH-8);
        ctx.textAlign = 'right';
        ctx.fillStyle = rgba(EM, 0.7); ctx.fillText('● Best zone', CW-8, CH-18);
        ctx.fillStyle = rgba(AM, 0.7); ctx.fillText('● Good zone', CW-8, CH-6);
    }

    function render() {
        ctx.clearRect(0, 0, CW, CH);
        drawPitch();
        drawZones();
        drawDefenders();
        if (ball) drawBall();
        drawAttackers();
        drawQualLabel();
        drawResult();
        drawHints();
        if (zoneFlash.alpha > 0) zoneFlash.alpha -= 0.014;
    }

    // ── Game logic ────────────────────────────────────────────────────────────

    function startTiming() {
        phase = 'timing';
        var speedBonus = power === 'high' ? 0.004 : power === 'low' ? -0.002 : 0;
        meter = { val:0.5, dir:1, spd:0.012+speedBonus, locked:false, quality:0 };
        document.getElementById('meter-outer').classList.add('visible');
        document.getElementById('action-btn').disabled = true;
    }

    function lockMeter() {
        if (phase !== 'timing' || meter.locked) return;
        meter.locked = true;
        var dist = Math.abs(meter.val - 0.5) * 2;
        meter.quality = Math.max(0, 1 - dist * 1.65);
        if      (meter.quality > 0.75) { qualLabel = { text:'PERFECT!', alpha:1.5, col:EM }; }
        else if (meter.quality > 0.44) { qualLabel = { text:'GOOD',     alpha:1.5, col:AM }; }
        else                           { qualLabel = { text:'POOR',     alpha:1.5, col:RE }; }
        document.getElementById('meter-outer').classList.remove('visible');
        startFlight();
    }

    function calcGoalProb() {
        var bestProb  = 0;
        var bestZoneId = null;
        for (var ai = 0; ai < attackers.length; ai++) {
            var a = attackers[ai];
            for (var zi = 0; zi < ZONES.length; zi++) {
                var z = ZONES[zi];
                var dist = Math.hypot(a.x - z.x, a.y - z.y);
                if (dist >= z.r + 12) continue;
                var overlap = Math.max(0, 1 - dist / (z.r + 12));
                var zw = zoneW(z) * overlap;
                var pw = z.p[power];
                var attInZone = attackers.filter(function(aa) {
                    return Math.hypot(aa.x - z.x, aa.y - z.y) < z.r + 12;
                }).length;
                var defInZone = DEF.filter(function(d) { return d.zone === z.id; }).length;
                var netAdv = attInZone - defInZone;
                // Raised baseline from 0.50 to 0.72; +0.20 per net attacker advantage
                var defMult = defInZone > 0
                    ? Math.max(0.32, Math.min(1.0, 0.72 + netAdv * 0.20))
                    : 1.0;
                var candidate = zw * pw * defMult;
                if (candidate > bestProb) { bestProb = candidate; bestZoneId = z.id; }
            }
        }
        zoneFlash.id = bestZoneId;
        // Quality: poor=0.25 baseline so a mis-hit still produces some threat
        var qm = 0.25 + 0.75 * meter.quality;
        return Math.min(bestProb * qm, 0.82);
    }

    // Ball flight targets and bezier control points for each side
    var TARGETS = {
        right: {
            inswinger:  { x: G_X+20,        y: PA_Y+18  },
            outswinger: { x: G_X+GW-20,      y: PA_Y+18  },
            nearpost:   { x: G_X+5,           y: PA_Y+5   },
            driven:     { x: PA_X+PA_W/2,     y: PA_Y+PS_D },
        },
        left: {
            inswinger:  { x: G_X+GW-20,      y: PA_Y+18  },
            outswinger: { x: G_X+20,          y: PA_Y+18  },
            nearpost:   { x: G_X+GW-5,        y: PA_Y+5   },
            driven:     { x: PA_X+PA_W/2,     y: PA_Y+PS_D },
        },
    };
    // Cubic bezier: two control points per delivery type
    // P0 = corner, P1a = initial direction off boot, P1b = bend point, P2 = landing zone
    var CTRLS = {
        right: {
            inswinger:  [{ x:743, y:105 }, { x:450, y:140 }], // straight into box then bends left to near post
            outswinger: [{ x:700, y:75  }, { x:520, y:170 }], // shallow start then drops to back post
            nearpost:   [{ x:650, y:46  }, { x:480, y:54  }], // flat delivery along goal line
            driven:     [{ x:680, y:62  }, { x:550, y:162 }], // hard low ball to pen spot
        },
        left: {
            inswinger:  [{ x: 57, y:105 }, { x:350, y:140 }], // mirrors right
            outswinger: [{ x:100, y:75  }, { x:280, y:170 }],
            nearpost:   [{ x:150, y:46  }, { x:320, y:54  }],
            driven:     [{ x:120, y:62  }, { x:250, y:162 }],
        },
    };

    function setDefenderTargets() {
        var end = ball.p2;
        var pull = { np:0.10, bp:0.10, '6y':0.42, ps:0.52, eb:0.48 };
        for (var i = 0; i < DEF.length; i++) {
            var d = DEF[i], b = DEF_BASE[i];
            var p = pull[d.zone] || 0.30;
            d.tx = b.x + (end.x-b.x)*p + (Math.random()-0.5)*24;
            d.ty = b.y + (end.y-b.y)*p + (Math.random()-0.5)*18;
            d.tx = Math.max(PA_X+5,  Math.min(PA_X+PA_W-5, d.tx));
            d.ty = Math.max(PA_Y+2,  Math.min(PA_Y+PA_H-5, d.ty));
        }
    }

    function updateDefenderMovement() {
        for (var i = 0; i < DEF.length; i++) {
            DEF[i].x += (DEF[i].tx - DEF[i].x) * 0.07;
            DEF[i].y += (DEF[i].ty - DEF[i].y) * 0.07;
        }
    }

    function startFlight() {
        var cp   = cornerPos();
        var base = TARGETS[side][ctype];
        var ctrl = CTRLS[side][ctype];
        var noise = (1 - meter.quality) * 54;
        var end = {
            x: base.x + (Math.random()-0.5)*noise*2,
            y: base.y + (Math.random()-0.5)*noise,
        };
        ball = {
            x:cp.x, y:cp.y, trail:[],
            p0:{x:cp.x, y:cp.y},
            p1a: ctrl[0], p1b: ctrl[1],
            p2:end,
            t:0, dur: ctype === 'nearpost' ? 82 : ctype === 'driven' ? 98 : 125,
        };
        phase = 'flight';
        setDefenderTargets();
    }

    function updateFlight() {
        if (!ball) return;
        ball.t = Math.min(ball.t+1, ball.dur);
        var t = ball.t / ball.dur, mt = 1-t;
        var nx = mt*mt*mt*ball.p0.x + 3*mt*mt*t*ball.p1a.x + 3*mt*t*t*ball.p1b.x + t*t*t*ball.p2.x;
        var ny = mt*mt*mt*ball.p0.y + 3*mt*mt*t*ball.p1a.y + 3*mt*t*t*ball.p1b.y + t*t*t*ball.p2.y;
        ball.trail.push({x:ball.x, y:ball.y});
        if (ball.trail.length > 16) ball.trail.shift();
        ball.x = nx; ball.y = ny;
        updateDefenderMovement();
        if (ball.t >= ball.dur) resolveResult();
    }

    function resolveResult() {
        var prob = calcGoalProb();
        resultGoal = Math.random() < prob;
        zoneFlash.alpha = 1.8;
        animT = 0;
        if (resultGoal) { streak++; if (streak > best) best = streak; phase = 'goal_anim'; }
        else            { streak = 0; phase = 'miss_anim'; ball = null; }
        updateStreakUI();
        document.getElementById('action-btn').disabled = true;
        setTimeout(function () {
            phase = 'done';
            var btn = document.getElementById('action-btn');
            btn.textContent = 'Next Corner';
            btn.disabled = false;
            var msg = document.getElementById('result-msg');
            var zoneName = '';
            if (zoneFlash.id) {
                for (var i = 0; i < ZONES.length; i++) {
                    if (ZONES[i].id === zoneFlash.id) { zoneName = ZONES[i].name; break; }
                }
            }
            if (resultGoal) {
                msg.textContent = 'Goal!' + (zoneName ? '  ·  ' + zoneName : '');
                msg.className = 'goal';
            } else {
                msg.textContent = 'Cleared.' + (zoneName ? '  ·  ' + zoneName : '');
                msg.className = 'miss';
            }
        }, 1900);
    }

    function updateGoalBall() {
        if (!ball) return;
        ball.x += (G_X+GW/2 - ball.x) * 0.14;
        ball.y += (PA_Y-8   - ball.y)  * 0.14;
    }

    function nextCorner() {
        ball = null; phase = 'setup';
        DEF = randomizeDef();
        zoneFlash = { id:null, alpha:0 };
        document.getElementById('action-btn').textContent = 'Take Corner';
        document.getElementById('action-btn').disabled = false;
        var msg = document.getElementById('result-msg');
        msg.textContent = ' '; msg.className = '';
    }

    function updateStreakUI() {
        document.getElementById('streak-now').textContent      = streak;
        document.getElementById('streak-best-val').textContent  = best;
    }

    // ── Animation loop ────────────────────────────────────────────────────────
    function loop() {
        if (phase === 'timing' && !meter.locked) {
            meter.val += meter.spd * meter.dir;
            if (meter.val >= 1) { meter.val = 1; meter.dir = -1; meter.spd = Math.min(meter.spd*1.07, 0.048); }
            if (meter.val <= 0) { meter.val = 0; meter.dir =  1; meter.spd = Math.min(meter.spd*1.07, 0.048); }
            document.getElementById('meter-needle').style.left = (meter.val * 100) + '%';
        }
        if (phase === 'flight')    updateFlight();
        if (phase === 'goal_anim') updateGoalBall();
        render();
        requestAnimationFrame(loop);
    }

    // ── Input ─────────────────────────────────────────────────────────────────
    function canvasXY(e) {
        var r = canvas.getBoundingClientRect();
        var sx = CW / r.width, sy = CH / r.height;
        var src = e.touches ? e.touches[0] : e;
        return { x:(src.clientX-r.left)*sx, y:(src.clientY-r.top)*sy };
    }

    canvas.addEventListener('mousedown', function(e) {
        if (phase !== 'setup') return;
        var p = canvasXY(e);
        for (var i = 0; i < attackers.length; i++) {
            if (Math.hypot(p.x-attackers[i].x, p.y-attackers[i].y) < 18) {
                drag = { idx:i, ox:p.x-attackers[i].x, oy:p.y-attackers[i].y };
                canvas.style.cursor = 'grabbing'; break;
            }
        }
    });
    window.addEventListener('mousemove', function(e) {
        if (!drag) return;
        var p = canvasXY(e);
        attackers[drag.idx].x = Math.max(12, Math.min(CW-12, p.x-drag.ox));
        attackers[drag.idx].y = Math.max(PA_Y, Math.min(PA_Y+PA_H, p.y-drag.oy));
    });
    window.addEventListener('mouseup', function() { drag = null; canvas.style.cursor = ''; });

    canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        if (phase === 'timing') { lockMeter(); return; }
        if (phase !== 'setup') return;
        var p = canvasXY(e);
        for (var i = 0; i < attackers.length; i++) {
            if (Math.hypot(p.x-attackers[i].x, p.y-attackers[i].y) < 24) {
                drag = { idx:i, ox:p.x-attackers[i].x, oy:p.y-attackers[i].y }; break;
            }
        }
    }, { passive:false });
    canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (!drag) return;
        var p = canvasXY(e);
        attackers[drag.idx].x = Math.max(12, Math.min(CW-12, p.x-drag.ox));
        attackers[drag.idx].y = Math.max(PA_Y, Math.min(PA_Y+PA_H, p.y-drag.oy));
    }, { passive:false });
    canvas.addEventListener('touchend', function() { drag = null; });

    canvas.addEventListener('click', function() { if (phase === 'timing') lockMeter(); });
    document.getElementById('meter-track').addEventListener('click', function() {
        if (phase === 'timing') lockMeter();
    });
    document.addEventListener('keydown', function(e) {
        if (e.code === 'Space') { e.preventDefault(); if (phase === 'timing') lockMeter(); }
    });

    document.getElementById('action-btn').addEventListener('click', function() {
        if (phase === 'setup') startTiming();
        else if (phase === 'done') nextCorner();
    });
    document.getElementById('type-btns').addEventListener('click', function(e) {
        var btn = e.target.closest('[data-type]');
        if (!btn || phase !== 'setup') return;
        ctype = btn.dataset.type;
        document.querySelectorAll('#type-btns [data-type]').forEach(function(b) {
            b.classList.toggle('active', b === btn);
        });
    });
    document.getElementById('power-btns').addEventListener('click', function(e) {
        var btn = e.target.closest('[data-power]');
        if (!btn || phase !== 'setup') return;
        power = btn.dataset.power;
        document.querySelectorAll('#power-btns [data-power]').forEach(function(b) {
            b.classList.toggle('active', b === btn);
        });
    });
    document.getElementById('side-btns').addEventListener('click', function(e) {
        var btn = e.target.closest('[data-side]');
        if (!btn || phase !== 'setup') return;
        side = btn.dataset.side;
        document.querySelectorAll('#side-btns [data-side]').forEach(function(b) {
            b.classList.toggle('active', b === btn);
        });
    });
    document.getElementById('reset-btn').addEventListener('click', function() {
        if (phase === 'setup') attackers = defaultAttackers();
    });

    loop();
})();
</script>
</body>
</html>
