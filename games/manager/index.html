<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Manager — Moosish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="players.js" onerror="window._noPlayers=true"></script>
<style>
:root {
  --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#2d2d2d; --border:rgba(148,163,184,0.12);
  --primary:#10b981; --primary-d:#059669; --primary-light:#34d399;
  --text:#f8fafc; --muted:#94a3b8;
  --red:#ef4444; --yellow:#f59e0b; --blue:#3b82f6; --purple:#8b5cf6;
  --radius:12px; --gap:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;min-height:100vh}
a{color:var(--primary);text-decoration:none}
button{cursor:pointer;font-family:inherit;font-size:13px;border:none;border-radius:6px;padding:8px 14px;transition:all .2s cubic-bezier(.4,0,.2,1)}
select{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;width:100%}
input{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;width:100%;outline:none}
input:focus{border-color:var(--primary)}

/* === SCREENS === */
.screen{display:none !important}
.screen.active{display:flex !important}

/* === START SCREEN === */
#screen-start{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 60% 40%,#0e2a1a 0%,var(--bg) 70%);
}
.start-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:40px 36px;width:100%;max-width:500px;display:flex;flex-direction:column;gap:24px}
.start-card h1{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:0}
.start-card h1 span{color:var(--primary)}
.start-card p.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.field-group{display:flex;flex-direction:column;gap:6px}
.field-group label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.btn-primary{background:var(--primary);color:#fff;font-weight:700;font-size:15px;padding:12px;border-radius:8px;width:100%;margin-top:4px}
.btn-primary:hover{background:var(--primary-d)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.save-badge{text-align:center;font-size:12px;color:var(--muted)}
.save-badge button{background:none;color:var(--primary);font-size:12px;padding:2px 6px;text-decoration:underline}

/* === HUB === */
#screen-hub{min-height:100vh;display:flex;flex-direction:column}
.hub-bar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 16px;display:flex;align-items:center;gap:16px;height:52px;position:sticky;top:0;z-index:10
}
.hub-club{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.hub-club .badge{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}
.hub-meta{margin-left:auto;display:flex;align-items:center;gap:16px}
.hub-meta .item{font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end}
.hub-meta .item strong{color:var(--text);font-size:14px}
.hub-nav{
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;overflow-x:auto;scrollbar-width:none;padding:0 4px;
}
.hub-nav::-webkit-scrollbar{display:none}
.hub-nav button{
  background:none;color:var(--muted);padding:12px 16px;border-radius:0;
  border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;
}
.hub-nav button.active{color:var(--primary);border-bottom-color:var(--primary)}
.hub-nav button:hover:not(.active){color:var(--text)}
.hub-content{flex:1;padding:16px;max-width:900px;width:100%;margin:0 auto}

/* === OVERVIEW === */
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
@media(max-width:600px){.overview-grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card h3{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.stat-row:last-child{border-bottom:none}
.stat-row .label{color:var(--muted);font-size:13px}
.stat-row .val{font-weight:600}
.next-fixture{display:flex;flex-direction:column;gap:8px}
.fixture-line{display:flex;align-items:center;gap:10px;font-size:13px}
.fixture-line .vs{color:var(--muted);flex:1;text-align:center;font-size:11px}
.fixture-line .team{font-weight:600;flex:2}
.fixture-line .team.away{text-align:right}
.fixture-btn{background:var(--primary);color:#fff;font-weight:700;padding:10px;border-radius:8px;width:100%;margin-top:4px}
.fixture-btn:hover{background:var(--primary-d)}
.results-list{display:flex;flex-direction:column;gap:6px}
.result-item{display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 8px;background:var(--surface2);border-radius:6px}
.result-item .score{font-weight:700;min-width:32px;text-align:center}
.result-item .score.w{color:var(--primary)}
.result-item .score.d{color:var(--yellow)}
.result-item .score.l{color:var(--red)}
.result-item .opp{flex:1;color:var(--muted)}
.result-item .venue{font-size:11px;color:var(--border)}

/* === SQUAD === */
.squad-filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-btn{background:var(--surface2);color:var(--muted);padding:5px 12px;border-radius:20px;font-size:12px}
.filter-btn.active{background:var(--primary);color:#fff}
.player-table{width:100%;border-collapse:collapse}
.player-table th{font-size:11px;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.4px}
.player-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.player-table tr:last-child td{border-bottom:none}
.player-table tr:hover td{background:var(--surface2)}
.pos-badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:700;min-width:32px;text-align:center}
.pos-gk{background:#7c3aed22;color:#a78bfa}
.pos-def{background:#1d4ed822;color:#60a5fa}
.pos-mid{background:#065f4622;color:#34d399}
.pos-fwd{background:#92400e22;color:#fbbf24}
.ovr-pill{display:inline-block;padding:2px 7px;border-radius:4px;font-size:12px;font-weight:700}
.player-name-cell{font-weight:600;font-size:13px}
.player-name-cell .nat{color:var(--muted);font-size:11px;font-weight:400}
.stat-bar{height:4px;background:var(--surface2);border-radius:2px;margin-top:3px}
.stat-bar-fill{height:4px;border-radius:2px;background:var(--primary)}
.btn-sell{background:var(--surface2);color:var(--red);padding:4px 10px;font-size:11px;border:1px solid var(--red)22}
.btn-sell:hover{background:var(--red)22}
.btn-loan{background:var(--surface2);color:var(--yellow);padding:4px 10px;font-size:11px;border:1px solid var(--yellow)22}
.btn-loan:hover{background:var(--yellow)22}

/* === TACTICS === */
.tactics-wrap{display:grid;grid-template-columns:1fr 280px;gap:16px}
@media(max-width:700px){.tactics-wrap{grid-template-columns:1fr}}
.pitch{
  background:linear-gradient(180deg,#15522a 0%,#1a6432 50%,#15522a 100%);
  border:2px solid #ffffff22;border-radius:8px;position:relative;
  padding-top:130%;
}
.pitch-inner{position:absolute;inset:0;padding:8px}
.pitch-lines{position:absolute;inset:0;pointer-events:none}
.player-slot{
  position:absolute;transform:translate(-50%,-50%);
  width:52px;text-align:center;cursor:pointer;
}
.player-slot .circle{
  width:40px;height:40px;border-radius:50%;background:var(--surface);
  border:2px solid var(--border);display:flex;flex-direction:column;
  align-items:center;justify-content:center;margin:0 auto 3px;
  font-size:10px;font-weight:700;transition:border-color .15s;
}
.player-slot .circle.filled{border-color:var(--primary)}
.player-slot .circle.gk-circle{border-color:var(--yellow)}
.player-slot .slot-name{font-size:9px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:52px;text-align:center}
.player-slot .slot-pos{font-size:8px;color:var(--muted)}
.formation-select{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.form-btn{background:var(--surface2);color:var(--muted);padding:5px 10px;border-radius:6px;font-size:12px}
.form-btn.active{background:var(--primary);color:#fff}
.bench-list{display:flex;flex-direction:column;gap:6px}
.bench-item{
  background:var(--surface2);border-radius:6px;padding:8px 10px;
  display:flex;align-items:center;gap:8px;cursor:pointer;border:1px solid transparent;
}
.bench-item:hover{border-color:var(--primary)55}
.bench-item .bi-name{flex:1;font-size:12px;font-weight:600}
.bench-item .bi-pos{font-size:10px;color:var(--muted)}
.bench-item .bi-ovr{font-size:12px;font-weight:700}

/* === TRANSFERS === */
.transfers-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.transfers-layout{grid-template-columns:1fr}}
.market-filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.market-player{
  background:var(--surface2);border-radius:6px;padding:10px 12px;
  display:flex;align-items:center;gap:10px;margin-bottom:6px;border:1px solid transparent;
}
.market-player:hover{border-color:var(--primary)44}
.market-player .mp-info{flex:1}
.market-player .mp-name{font-weight:600;font-size:13px}
.market-player .mp-meta{font-size:11px;color:var(--muted)}
.market-player .mp-price{font-size:12px;font-weight:700;color:var(--primary);white-space:nowrap}
.btn-buy{background:var(--primary)22;color:var(--primary);padding:5px 10px;font-size:11px;border:1px solid var(--primary)44;border-radius:5px}
.btn-buy:hover{background:var(--primary)44}
.btn-buy:disabled{opacity:.4;cursor:not-allowed}
.budget-bar{
  background:var(--surface2);border-radius:8px;padding:12px;
  display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;
}
.budget-bar .amount{font-size:20px;font-weight:800;color:var(--primary)}
.budget-bar .label{font-size:12px;color:var(--muted)}

/* === FIXTURES === */
.fixtures-list{display:flex;flex-direction:column;gap:6px}
.fixture-item{
  background:var(--surface2);border-radius:6px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;border-left:3px solid var(--border);
}
.fixture-item.current{border-left-color:var(--primary)}
.fixture-item.win{border-left-color:var(--primary)}
.fixture-item.draw{border-left-color:var(--yellow)}
.fixture-item.loss{border-left-color:var(--red)}
.fixture-item .fi-gw{font-size:11px;color:var(--muted);min-width:28px}
.fixture-item .fi-teams{flex:1;font-size:13px;font-weight:600}
.fixture-item .fi-teams .venue{font-size:10px;color:var(--muted);font-weight:400;margin-left:4px}
.fixture-item .fi-score{font-weight:700;font-size:14px;min-width:40px;text-align:center}
.fixture-item .fi-btn{background:var(--primary)22;color:var(--primary);padding:4px 10px;font-size:11px;border-radius:5px;border:1px solid var(--primary)44}
.fixture-item .fi-btn:hover{background:var(--primary)44}

/* === TABLE === */
.league-table{width:100%;border-collapse:collapse;font-size:12px}
.league-table th{color:var(--muted);padding:5px 6px;text-align:center;font-weight:600;text-transform:uppercase;font-size:10px;border-bottom:1px solid var(--border)}
.league-table th:first-child{text-align:left}
.league-table th:nth-child(2){text-align:left}
.league-table td{padding:6px;text-align:center;border-bottom:1px solid var(--border)55}
.league-table td:first-child{text-align:left;color:var(--muted);font-size:11px}
.league-table td:nth-child(2){text-align:left;font-weight:600}
.league-table tr.my-team td{background:var(--primary)0d}
.league-table tr.my-team td:nth-child(2){color:var(--primary)}
.pts-cell{font-weight:800;color:var(--text)}
.qual-cl{border-left:3px solid var(--blue)}
.qual-el{border-left:3px solid var(--yellow)}
.rel-zone{border-left:3px solid var(--red)}

/* === MATCH SCREEN === */
#screen-match{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.match-header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:16px;display:flex;flex-direction:column;align-items:center;gap:4px;
}
.match-scoreline{font-size:36px;font-weight:800;letter-spacing:2px;display:flex;align-items:center;gap:16px}
.match-scoreline .sep{color:var(--border);font-weight:400}
.match-teams{display:flex;gap:60px;font-size:13px;color:var(--muted);font-weight:600}
.match-teams span{text-align:center}
.match-time{font-size:11px;color:var(--primary);font-weight:600;margin-top:2px}
.match-body{flex:1;display:grid;grid-template-columns:1fr 260px;gap:0;max-width:860px;width:100%;margin:0 auto;padding:16px;gap:16px}
@media(max-width:660px){.match-body{grid-template-columns:1fr}}
.commentary-feed{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  overflow-y:auto;max-height:360px;display:flex;flex-direction:column-reverse;
}
.comment-item{padding:10px 14px;border-bottom:1px solid var(--border)55;font-size:13px;line-height:1.5;display:flex;gap:10px}
.comment-item:last-child{border-bottom:none}
.comment-item .min{font-weight:700;color:var(--primary);min-width:28px;font-size:12px}
.comment-item.goal .min{color:var(--yellow)}
.comment-item.goal{background:var(--yellow)0a}
.comment-item.save{background:var(--blue)08}
.comment-item .text{color:var(--muted)}
.comment-item .text strong{color:var(--text)}
.match-stats{display:flex;flex-direction:column;gap:10px}
.match-stat-row{display:flex;flex-direction:column;gap:4px}
.match-stat-row .labels{display:flex;justify-content:space-between;font-size:12px}
.match-stat-row .labels .lbl{color:var(--muted);font-size:11px;text-align:center;flex:1}
.match-stat-row .labels .val{font-weight:700;min-width:24px}
.match-stat-row .labels .val.home{text-align:left}
.match-stat-row .labels .val.away{text-align:right}
.poss-bar{height:6px;background:var(--surface2);border-radius:3px;display:flex;overflow:hidden}
.poss-bar .home{background:var(--primary);transition:width .5s}
.poss-bar .away{background:var(--blue);transition:width .5s}
.xg-bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;position:relative}
.xg-fill{height:100%;background:var(--primary);transition:width .5s;border-radius:3px}
.match-footer{padding:16px;display:flex;gap:10px;justify-content:center}
.btn-sim{background:var(--blue);color:#fff;font-weight:700;padding:10px 24px;border-radius:8px}
.btn-sim:hover{background:#2563eb}
.btn-end{background:var(--surface2);color:var(--text);font-weight:600;padding:10px 24px;border-radius:8px}
.btn-end:hover{background:var(--surface)}

/* === MODAL === */
.modal-bg{
  position:fixed;inset:0;background:#00000088;z-index:100;
  display:none;align-items:center;justify-content:center;padding:16px;
}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto}
.modal h2{font-size:18px;font-weight:800;margin-bottom:4px}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.modal-actions .btn-cancel{background:var(--surface2);color:var(--muted)}
.modal-actions .btn-cancel:hover{color:var(--text)}
.modal-actions .btn-confirm{background:var(--primary);color:#fff;font-weight:700}
.modal-actions .btn-confirm:hover{background:var(--primary-d)}

/* === MISC === */
.empty-state{text-align:center;color:var(--muted);padding:40px;font-size:13px}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600;background:var(--surface2);color:var(--muted)}
.tag.green{background:var(--primary)22;color:var(--primary)}
.tag.red{background:var(--red)22;color:var(--red)}
.tag.yellow{background:var(--yellow)22;color:var(--yellow)}
.scroll-area{overflow-y:auto;max-height:420px}
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="screen-start" class="screen active">
  <div class="start-card">
    <div>
      <h1>Football <span>Manager</span></h1>
      <p class="sub">Build a dynasty. Win the title.</p>
    </div>
    <div class="field-group">
      <label>League</label>
      <select id="sel-league" onchange="onLeagueChange()">
        <option value="">— Select league —</option>
        <option value="epl">Premier League</option>
        <option value="laliga">La Liga</option>
        <option value="bundesliga">Bundesliga</option>
        <option value="seriea">Serie A</option>
        <option value="ligue1">Ligue 1</option>
      </select>
    </div>
    <div class="field-group">
      <label>Club</label>
      <select id="sel-team" disabled><option value="">— Pick a league first —</option></select>
    </div>
    <div class="field-group">
      <label>Starting Year</label>
      <select id="sel-year">
        <script>for(var y=2025;y>=2000;y--) document.write('<option value="'+y+'">'+y+'/'+((y+1)+'').slice(2)+'</option>');</script>
      </select>
    </div>
    <button class="btn-primary" id="btn-start" onclick="startGame()" disabled>Start Career</button>
    <div class="save-badge" id="save-badge" style="display:none">
      Save found — <button onclick="loadGame()">Continue</button>
    </div>
  </div>
</div>

<!-- HUB -->
<div id="screen-hub" class="screen">
  <div class="hub-bar">
    <div class="hub-club">
      <div class="badge" id="hub-badge"></div>
      <span id="hub-club-name"></span>
    </div>
    <div class="hub-meta">
      <div class="item"><span class="label">Season</span><strong id="hub-season"></strong></div>
      <div class="item"><span class="label">Budget</span><strong id="hub-budget"></strong></div>
      <div class="item"><span class="label">Position</span><strong id="hub-pos"></strong></div>
    </div>
  </div>
  <nav class="hub-nav">
    <button onclick="showTab('overview')" id="tab-btn-overview">Overview</button>
    <button onclick="showTab('squad')" id="tab-btn-squad">Squad</button>
    <button onclick="showTab('tactics')" id="tab-btn-tactics">Tactics</button>
    <button onclick="showTab('transfers')" id="tab-btn-transfers">Transfers</button>
    <button onclick="showTab('fixtures')" id="tab-btn-fixtures">Fixtures</button>
    <button onclick="showTab('table')" id="tab-btn-table">Table</button>
  </nav>
  <div class="hub-content">
    <div id="tab-overview"></div>
    <div id="tab-squad" style="display:none"></div>
    <div id="tab-tactics" style="display:none"></div>
    <div id="tab-transfers" style="display:none"></div>
    <div id="tab-fixtures" style="display:none"></div>
    <div id="tab-table" style="display:none"></div>
  </div>
</div>

<!-- MATCH SCREEN -->
<div id="screen-match" class="screen">
  <div class="match-header">
    <div class="match-teams">
      <span id="match-home-name"></span>
      <span id="match-away-name"></span>
    </div>
    <div class="match-scoreline">
      <span id="match-home-score">0</span>
      <span class="sep">—</span>
      <span id="match-away-score">0</span>
    </div>
    <div class="match-time" id="match-time">0'</div>
  </div>
  <div class="match-body">
    <div>
      <div class="commentary-feed" id="commentary-feed"></div>
    </div>
    <div class="match-stats" id="match-stats-panel"></div>
  </div>
  <div class="match-footer">
    <button class="btn-sim" id="btn-sim-live" onclick="simLiveNext()">▶ Simulate</button>
    <button class="btn-end" id="btn-skip-result" onclick="instantResult()" style="background:var(--surface2);color:var(--muted)">Skip to Result</button>
    <button class="btn-end" id="btn-match-end" onclick="endMatch()" style="display:none">Back to Hub</button>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
/* =====================================================================
   DATA
   ===================================================================== */

var LEAGUES = {
  epl:        { name:'Premier League', country:'England',  n:20 },
  laliga:     { name:'La Liga',        country:'Spain',    n:20 },
  bundesliga: { name:'Bundesliga',     country:'Germany',  n:18 },
  seriea:     { name:'Serie A',        country:'Italy',    n:20 },
  ligue1:     { name:'Ligue 1',        country:'France',   n:18 },
};

/* tier: 1=elite, 2=solid, 3=lower-table */

/* --- Seeded PRNG (mulberry32) --- */
function mkRand(seed) {
  var s = seed | 0;
  return function() {
    s = (s + 0x6D2B79F5) | 0;
    var t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function strHash(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
  return h;
}

/* --- OVR by position --- */
var POS_WEIGHTS = {
  GK:  {dri:.30,def:.25,sho:.22,pas:.12,phy:.08,pac:.03},
  CB:  {def:.40,phy:.25,pas:.15,pac:.10,dri:.05,sho:.05},
  LB:  {def:.30,pac:.25,pas:.20,phy:.15,dri:.07,sho:.03},
  RB:  {def:.30,pac:.25,pas:.20,phy:.15,dri:.07,sho:.03},
  LWB: {def:.25,pac:.25,pas:.20,phy:.15,dri:.10,sho:.05},
  RWB: {def:.25,pac:.25,pas:.20,phy:.15,dri:.10,sho:.05},
  CDM: {def:.35,pas:.25,phy:.20,dri:.10,pac:.05,sho:.05},
  CM:  {pas:.30,dri:.20,phy:.20,def:.15,pac:.10,sho:.05},
  CAM: {pas:.30,dri:.25,sho:.20,pac:.12,phy:.08,def:.05},
  LM:  {pac:.25,dri:.25,pas:.20,sho:.15,def:.08,phy:.07},
  RM:  {pac:.25,dri:.25,pas:.20,sho:.15,def:.08,phy:.07},
  LW:  {pac:.28,dri:.28,sho:.22,pas:.12,phy:.05,def:.05},
  RW:  {pac:.28,dri:.28,sho:.22,pas:.12,phy:.05,def:.05},
  CF:  {sho:.30,dri:.25,pac:.20,pas:.12,phy:.08,def:.05},
  ST:  {sho:.32,pac:.25,dri:.20,phy:.12,pas:.08,def:.03},
};
function calcOvr(p, pos) {
  var w = POS_WEIGHTS[pos] || POS_WEIGHTS.CM;
  return Math.round(
    p.pac*w.pac + p.sho*w.sho + p.pas*w.pas +
    p.dri*w.dri + p.def*w.def + p.phy*w.phy
  );
}

/* Age-adjusted rating — peaks 26-29, grows before, declines after */
function ageAdj(baseVal, age) {
  if (age < 17) return Math.round(baseVal * 0.60);
  if (age < 20) return Math.round(baseVal * (0.60 + (age-17)*0.08));
  if (age < 23) return Math.round(baseVal * (0.84 + (age-20)*0.04));
  if (age < 30) return baseVal;                     // peak
  if (age < 34) return Math.round(baseVal * (1 - (age-29)*0.03));
  if (age < 38) return Math.round(baseVal * (0.88 - (age-33)*0.04));
  return Math.round(baseVal * 0.70);
}
function adjStats(p, year) {
  var age = year - p.born;
  return {
    pac: ageAdj(p.pac, age), sho: ageAdj(p.sho, age),
    pas: ageAdj(p.pas, age), dri: ageAdj(p.dri, age),
    def: ageAdj(p.def, age), phy: ageAdj(p.phy, age),
  };
}
function playerOvr(p, year) {
  if (p.o) return p.o;  // use FIFA official overall when available
  var st = adjStats(p, year);
  var w = POS_WEIGHTS[p.pos] || POS_WEIGHTS.CM;
  return Math.round(
    st.pac*w.pac + st.sho*w.sho + st.pas*w.pas +
    st.dri*w.dri + st.def*w.def + st.phy*w.phy
  );
}
function playerAvailable(p, year) {
  var age = year - p.born;
  return p.debut <= year && age >= 15 && age <= 40;
}
function playerValue(p, year) {
  var ovr = playerOvr(p, year);
  var age = year - p.born;
  var base = Math.pow(Math.max(0, ovr - 55), 2.2) * 0.04;
  var ageMult = age < 24 ? 1.3 : age < 28 ? 1.1 : age < 32 ? 0.85 : 0.5;
  return Math.max(0.5, Math.round(base * ageMult * 10) / 10);
}

/* Build squad from FIFA_PLAYERS dataset for a given team + year.
   d = FIFA season year (2014=FIFA15, 2018=FIFA19 …).
   We look for an exact year match, then fall back up to 4 years earlier. */
function buildSquad(teamId, year) {
  if (typeof FIFA_PLAYERS === 'undefined' || !FIFA_PLAYERS.length) {
    return _fallbackSquad(teamId, year);
  }
  function mapPlayer(p) {
    return {
      id: p.c + '_' + p.n.replace(/\s/g,'') + '_' + p.b,
      name: p.n, pos: p.p, born: p.b, debut: p.d,
      o: p.o, pac: p.pac, sho: p.sho, pas: p.pas,
      dri: p.dri, def: p.def, phy: p.phy,
      nat: p.nat, club: p.c,
    };
  }
  /* Try exact year, then step back to nearest available year (data starts 2014) */
  for (var delta = 0; delta <= 5; delta++) {
    var yr = year - delta;
    var squad = FIFA_PLAYERS.filter(function(p) {
      return p.c === teamId && p.d === yr && (yr - p.b) >= 14 && (yr - p.b) <= 42;
    });
    if (squad.length >= 8) return squad.map(mapPlayer);
  }
  return _fallbackSquad(teamId, year);
}

/* Fallback to hand-coded REAL_PLAYERS until players.js is generated */
function _fallbackSquad(teamId, year) {
  return REAL_PLAYERS
    .filter(function(p) {
      return p.club === teamId && p.debut <= year &&
             (year - p.born) >= 15 && (year - p.born) <= 40;
    });
}

  '4-2-3-1': [[50,90],[15,68],[37,68],[63,68],[85,68],[30,56],[70,56],[15,36],[50,33],[85,36],[50,14]],
  '3-5-2':   [[50,90],[20,68],[50,68],[80,68],[10,48],[30,48],[50,44],[70,48],[90,48],[35,18],[65,18]],
  '4-5-1':   [[50,90],[15,68],[37,68],[63,68],[85,68],[15,48],[35,44],[55,44],[75,44],[90,48],[50,18]],
  '3-4-3':   [[50,90],[20,68],[50,68],[80,68],[15,48],[38,44],[62,44],[85,48],[15,18],[50,16],[85,18]],
  '4-1-4-1': [[50,90],[15,68],[37,68],[63,68],[85,68],[50,56],[15,40],[37,40],[63,40],[85,40],[50,16]],
};
function POS_GROUP(pos) {
  if (pos==='GK') return 0;
  if (['CB','LB','RB','LWB','RWB'].includes(pos)) return 1;
  if (['CDM','CM','CAM','LM','RM'].includes(pos)) return 2;
  return 3;
}
function bestForSlot(squad, pos, used) {
  var group = POS_GROUP(pos);
  var candidates = squad.filter(function(p) {
    return !used.has(p.id) && (
      p.pos === pos ||
      (group === 1 && POS_GROUP(p.pos) === 1) ||
      (group === 2 && POS_GROUP(p.pos) === 2) ||
      (group === 3 && POS_GROUP(p.pos) === 3)
    );
  });
  if (!candidates.length) candidates = squad.filter(function(p) { return !used.has(p.id); });
  candidates.sort(function(a,b) { return playerOvr(b,G.year) - playerOvr(a,G.year); });
  return candidates[0] || null;
}
function autoLineup(squad, formation, year) {
  var slots = FORMATION_SLOTS[formation];
  var lineup = [];
  var used = new Set();
  slots.forEach(function(pos) {
    var p = bestForSlot(squad, pos, used);
    if (p) { lineup.push({pid:p.id,slot:pos}); used.add(p.id); }
  });
  return lineup;
}

/* --- Fixtures generator --- */
function generateFixtures(teams) {
  /* Round-robin double leg */
  var n = teams.length;
  var rounds = [];
  var t = teams.slice();
  if (n % 2 !== 0) t.push(null);
  var N = t.length;
  for (var r = 0; r < N - 1; r++) {
    var round = [];
    for (var i = 0; i < N/2; i++) {
      var h = t[i], a = t[N-1-i];
      if (h && a) round.push({home:h, away:a});
    }
    rounds.push(round);
    t.splice(1, 0, t.pop());
  }
  /* Second leg = reversed */
  var leg2 = rounds.map(function(r) {
    return r.map(function(f) { return {home:f.away, away:f.home}; });
  });
  return rounds.concat(leg2);
}

/* --- Team strengths from lineup --- */
function teamStrengths(teamId, year) {
  var squad = G.squads[teamId];
  var lineup = G.lineups[teamId];
  if (!squad || !lineup) { return {atk:70,mid:70,def:70,ovr:70}; }
  var slots = FORMATION_SLOTS[G.formations[teamId] || '4-3-3'];
  var atk=[],mid=[],def=[];
  lineup.forEach(function(li,i) {
    var p = squad.find(function(x){return x.id===li.pid;});
    if (!p) return;
    var o = playerOvr(p, year);
    var slot = slots[i] || li.slot;
    var g = POS_GROUP(slot);
    if (g===3) atk.push(o);
    else if (g===2) mid.push(o);
    else def.push(o);
  });
  function avg(arr) { return arr.length ? arr.reduce(function(a,b){return a+b;},0)/arr.length : 70; }
  return { atk:avg(atk), mid:avg(mid), def:avg(def), ovr:(avg(atk)+avg(mid)+avg(def))/3 };
}

var COMMENT_TEMPLATES = {
  goal_h: [
    '⚽ <strong>{scorer}</strong> puts {team} ahead!',
    '⚽ Brilliant finish from <strong>{scorer}</strong>!',
    '⚽ <strong>{scorer}</strong> doesn\'t miss from there. {team} lead!',

    '⚽ <strong>{scorer}</strong> finds the net! What a strike!',
  ],
  goal_a: [
    '⚽ <strong>{scorer}</strong> levels for {team}!',
    '⚽ <strong>{scorer}</strong> equalises! {team} are back in it.',
    '⚽ Goal for {team}. <strong>{scorer}</strong> takes his chance.',
    '⚽ <strong>{scorer}</strong> makes it level. Game on!',
  ],
  save: [
    '🧤 Great save! The goalkeeper denies <strong>{player}</strong>.',
    '🧤 Incredible stop from the keeper to keep out <strong>{player}</strong>.',
    '🧤 <strong>{player}</strong> shoots — straight at the keeper!',
  ],
  chance: [
    '🔥 <strong>{player}</strong> comes close! Just over the bar.',
    '🔥 Superb chance! <strong>{player}</strong> fires wide.',
    '📐 Corner for {team}. Good pressure building.',
    '💨 <strong>{player}</strong> bursts forward — blocked!',
  ],
  intro: [
    'The referee blows the whistle — we\'re underway!',
    'Kick off! {home} in {home_col} vs {away} in white.',
  ],
  half: ['Half time. The teams head for the dressing room.'],
  end:  ['Full time! The final whistle goes.'],
};
function pickComment(key, vars) {
  var arr = COMMENT_TEMPLATES[key];
  var tpl = arr[Math.floor(Math.random()*arr.length)];
  return tpl.replace(/\{(\w+)\}/g, function(_,k){return vars[k]||'';});
}
function scorerName(teamId) {
  var sq = G.squads[teamId];
  if (!sq || !sq.length) return 'unknown';
  var fwd = sq.filter(function(p){return ['ST','CF','LW','RW','CAM'].includes(p.pos);});
  var pool = fwd.length ? fwd : sq;
  return pool[Math.floor(Math.random()*pool.length)].name;
}
function chancer(teamId) {
  var sq = G.squads[teamId];
  if (!sq||!sq.length) return 'unknown';
  return sq[Math.floor(Math.random()*sq.length)].name;
}

function simulateMatch(homeId, awayId, opts) {
  /* opts: {live:bool, onEvent:fn(min,type,html), onDone:fn(result)} */
  opts = opts || {};
  var hs = teamStrengths(homeId, G.year);
  var as = teamStrengths(awayId, G.year);
  var hTeam = getTeam(homeId), aTeam = getTeam(awayId);

  /* Possession */
  var hMidAdv = hs.mid / (hs.mid + as.mid);
  var hPoss = Math.max(30, Math.min(70, Math.round(hMidAdv * 60 + 20)));
  var aPoss = 100 - hPoss;

  /* Shots */
  var hAtk = (hs.atk * 0.6 + hs.mid * 0.4) / 100;
  var aAtk = (as.atk * 0.6 + as.mid * 0.4) / 100;
  var hDefStr = (hs.def * 0.65 + hs.mid * 0.35) / 100;
  var aDefStr = (as.def * 0.65 + as.mid * 0.35) / 100;

  function poisson(lam) {
    var L=Math.exp(-lam),k=0,p=1;
    do { k++; p*=Math.random(); } while(p>L);
    return k-1;
  }
  var hShots = Math.max(2, poisson(hAtk * 14 + 1));
  var aShots = Math.max(1, poisson(aAtk * 12 + 0.8)); /* slight away disadvantage */
  var hSOT = Math.round(hShots * (0.30 + Math.random() * 0.25));
  var aSOT = Math.round(aShots * (0.28 + Math.random() * 0.25));
  var hxG = (hShots * (hAtk / (hAtk + aDefStr)) * 0.38);
  var axG = (aShots * (aAtk / (aAtk + hDefStr)) * 0.33);

  /* Goals from SOT */
  var hConv = Math.max(0.12, Math.min(0.60, 0.28 + (hAtk - aDefStr) * 2));
  var aConv = Math.max(0.10, Math.min(0.55, 0.25 + (aAtk - hDefStr) * 2));
  var hg = 0, ag = 0;
  for (var i=0;i<hSOT;i++) if(Math.random()<hConv) hg++;
  for (var i=0;i<aSOT;i++) if(Math.random()<aConv) ag++;

  var stats = {hPoss:hPoss,aPoss:aPoss,hShots:hShots,aShots:aShots,
    hSOT:hSOT,aSOT:aSOT,hxG:hxG.toFixed(1),axG:axG.toFixed(1),hg:hg,ag:ag};

  if (!opts.live) {
    if (opts.onDone) opts.onDone(stats);
    return stats;
  }

  /* Live: build event timeline */
  var events = [];
  events.push({min:0, type:'intro', html:pickComment('intro',{home:hTeam.name,away:aTeam.name,home_col:hTeam.pri})});
  events.push({min:45, type:'info', html:pickComment('half',[])});

  /* Place goals at random minutes */
  var hGoalMins = [], aGoalMins = [];
  for(var i=0;i<hg;i++) hGoalMins.push(Math.floor(Math.random()*88)+1);
  for(var i=0;i<ag;i++) aGoalMins.push(Math.floor(Math.random()*88)+1);

  /* Saves & chances — mix in ~6 events */
  var extraCount = 4 + Math.floor(Math.random()*4);
  for(var i=0;i<extraCount;i++) {
    var min = Math.floor(Math.random()*88)+1;
    var isH = Math.random()<0.5;
    var type = Math.random()<0.4?'save':'chance';
    var html = pickComment(type, {player:chancer(isH?homeId:awayId),team:(isH?hTeam:aTeam).name});
    events.push({min:min,type:type,html:html});
  }

  var curHg=0, curAg=0;
  hGoalMins.forEach(function(min){
    var sc=scorerName(homeId);
    events.push({min:min,type:'goal_h',html:pickComment('goal_h',{scorer:sc,team:hTeam.name}),hg:++curHg,ag:curAg});
  });
  aGoalMins.forEach(function(min){
    var sc=scorerName(awayId);
    events.push({min:min,type:'goal_a',html:pickComment('goal_a',{scorer:sc,team:aTeam.name}),hg:curHg,ag:++curAg});
  });
  events.push({min:90,type:'end',html:pickComment('end',[])});

  events.sort(function(a,b){return a.min-b.min;});

  /* Replay running scores */
  var rhg=0,rag=0;
  events.forEach(function(ev){
    if(ev.type==='goal_h') rhg++;
    if(ev.type==='goal_a') rag++;
    ev.scoreH=rhg; ev.scoreA=rag;
  });

  return {stats:stats, events:events};
}

/* --- Season helpers --- */
function getTeam(id) { return TEAMS.find(function(t){return t.id===id;}); }
function leagueTeams(lid) { return TEAMS.filter(function(t){return t.league===lid;}); }
function myResult(fix) {
  if(fix.result===undefined) return null;
  var isHome = fix.home===G.team;
  var hg=fix.result.hg, ag=fix.result.ag;
  if(isHome) return hg>ag?'w':hg===ag?'d':'l';
  return ag>hg?'w':ag===hg?'d':'l';
}
function tableEntry() {
  return G.table[G.team] || {w:0,d:0,l:0,gf:0,ga:0,pts:0};
}
function tablePos() {
  var entries = Object.keys(G.table).map(function(id){
    var e=G.table[id]; return {id:id,pts:e.pts,gd:e.gf-e.ga,gf:e.gf};
  });
  entries.sort(function(a,b){
    return b.pts-a.pts || (b.gd-a.gd) || b.gf-a.gf;
  });
  var pos = entries.findIndex(function(e){return e.id===G.team;});
  return pos+1;
}
function fmtMoney(m) {
  if(m>=100) return '£'+m.toFixed(0)+'m';
  if(m>=10)  return '£'+m.toFixed(1)+'m';
  return '£'+m.toFixed(1)+'m';
}
function posColor(pos) {
  return pos==='GK'?'pos-gk':
    ['CB','LB','RB','LWB','RWB'].includes(pos)?'pos-def':
    ['CDM','CM','CAM','LM','RM'].includes(pos)?'pos-mid':'pos-fwd';
}
function ovrColor(o) {
  if(o>=85) return '#10b981';
  if(o>=78) return '#3b82f6';
  if(o>=70) return '#f59e0b';
  return '#94a3b8';
}

/* --- Start screen --- */
function onLeagueChange() {
  var lid = document.getElementById('sel-league').value;
  var sel = document.getElementById('sel-team');
  sel.innerHTML = '<option value="">— Select club —</option>';
  if(!lid){sel.disabled=true; document.getElementById('btn-start').disabled=true; return;}
  var teams = leagueTeams(lid);
  teams.sort(function(a,b){return a.tier-b.tier||a.name.localeCompare(b.name);});
  teams.forEach(function(t){
    sel.innerHTML += '<option value="'+t.id+'">'+t.name+'</option>';
  });
  sel.disabled=false;
  sel.onchange = function(){document.getElementById('btn-start').disabled=!sel.value;};
}

function startGame() {
  var lid = document.getElementById('sel-league').value;
  var tid = document.getElementById('sel-team').value;
  var yr  = parseInt(document.getElementById('sel-year').value);
  if(!lid||!tid||!yr) return;
  initGame(lid,tid,yr);
}

function initGame(lid, tid, yr) {
  G.league = lid; G.team = tid; G.year = yr;
  G.week = 0;
  /* Budget by tier */
  var team = getTeam(tid);
  G.budget = team.tier===1 ? 100 : team.tier===2 ? 45 : 20;

  /* Build squads for every team in league */
  var teams = leagueTeams(lid);
  G.squads = {}; G.formations = {}; G.lineups = {}; G.table = {};
  teams.forEach(function(t){
    G.squads[t.id] = buildSquad(t.id, yr);
    G.formations[t.id] = '4-3-3';
    G.lineups[t.id] = autoLineup(G.squads[t.id], '4-3-3', yr);
    G.table[t.id] = {w:0,d:0,l:0,gf:0,ga:0,pts:0};
  });

  /* Generate fixtures */
  var teamIds = teams.map(function(t){return t.id;});
  var rounds = generateFixtures(teamIds);
  G.fixtures = [];
  rounds.forEach(function(round, gw){
    round.forEach(function(fix){
      G.fixtures.push({home:fix.home,away:fix.away,gw:gw+1});
    });
  });

  /* Auto-sim all AI vs AI matches that aren't mine up to now */
  /* (Season starts fresh — nothing to sim) */

  saveGame();
  showScreen('hub');
  updateHubBar();
  showTab('overview');
}

function updateHubBar() {
  var team = getTeam(G.team);
  document.getElementById('hub-badge').textContent = team.abbr;
  document.getElementById('hub-badge').style.background = team.pri;
  document.getElementById('hub-club-name').textContent = team.name;
  document.getElementById('hub-season').textContent = G.year+'/'+(G.year+1+'').slice(2);
  document.getElementById('hub-budget').textContent = fmtMoney(G.budget);
  document.getElementById('hub-pos').textContent = '#'+tablePos();
}

  var svgLines='<svg class="pitch-lines" viewBox="0 0 100 130" preserveAspectRatio="none">'+

    '<line x1="2" y1="65" x2="98" y2="65" stroke="rgba(255,255,255,.15)" stroke-width="0.6"/>'+
    '<circle cx="50" cy="65" r="15" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="0.5"/>'+
    '<rect x="28" y="2" width="44" height="18" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="0.5"/>'+
    '<rect x="38" y="2" width="24" height="8" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="0.5"/>'+
    '<rect x="28" y="110" width="44" height="18" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="0.5"/>'+
    '<rect x="38" y="120" width="24" height="8" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="0.5"/>'+
  '</svg>';

  /* Bench */
  var used=new Set(lineup.map(function(l){return l.pid;}));
  var bench=squad.filter(function(p){return !used.has(p.id);})
    .sort(function(a,b){return playerOvr(b,G.year)-playerOvr(a,G.year);})
    .slice(0,7);
  var benchHtml=bench.map(function(p){
    var o=playerOvr(p,G.year);
    return '<div class="bench-item">'+
      '<span class="pos-badge '+posColor(p.pos)+'" style="font-size:10px">'+p.pos+'</span>'+
      '<span class="bi-name">'+p.name+'</span>'+
      '<span class="bi-ovr" style="color:'+ovrColor(o)+'">'+o+'</span>'+
    '</div>';
  }).join('');

  el.innerHTML='<div class="formation-select">'+formBtns+'</div>'+
    '<div class="tactics-wrap">'+
      '<div class="pitch">'+svgLines+'<div class="pitch-inner">'+slotHtml+'</div></div>'+
      '<div><div class="card"><h3>Bench</h3><div class="bench-list">'+benchHtml+'</div></div></div>'+
    '</div>';
}
function setFormation(f){
  G.formations[G.team]=f;
  G.lineups[G.team]=autoLineup(G.squads[G.team],f,G.year);
  saveGame();renderTactics();
}
function openSlotModal(slotIdx){
  var formation=G.formations[G.team];
  var slots=FORMATION_SLOTS[formation];
  var slotPos=slots[slotIdx];
  var squad=G.squads[G.team];
  var used=new Set(G.lineups[G.team].map(function(l,i){return i!==slotIdx?l.pid:null;}));
  var candidates=squad.filter(function(p){return !used.has(p.id);})
    .sort(function(a,b){return playerOvr(b,G.year)-playerOvr(a,G.year);});

  var rows=candidates.map(function(p){
    var o=playerOvr(p,G.year);
    return '<div class="bench-item" onclick="assignSlot('+slotIdx+',\''+p.id+'\')">'+
      '<span class="pos-badge '+posColor(p.pos)+'">'+p.pos+'</span>'+
      '<span class="bi-name">'+p.name+'</span>'+
      '<span class="bi-ovr" style="color:'+ovrColor(o)+'">'+o+'</span>'+
    '</div>';
  }).join('');
  showModal('<h2>'+slotPos+' slot</h2><p class="sub">Select a player to fill this position</p><div class="bench-list scroll-area" style="max-height:320px">'+rows+'</div>');
}
function assignSlot(slotIdx, pid){
  G.lineups[G.team][slotIdx].pid=pid;
  saveGame();closeModal();renderTactics();
}

/* --- Transfers tab --- */
var marketFilter='all';
var marketSearch='';
function renderTransfers(){
  var el=document.getElementById('tab-transfers');
  var team=getTeam(G.team);

  /* Build market: available players not in my squad */
  var myIds=new Set(G.squads[G.team].map(function(p){return p.id;}));
  var market=[];
  Object.keys(G.squads).forEach(function(tid){
    if(tid===G.team) return;
    G.squads[tid].forEach(function(p){
      if(!myIds.has(p.id) && playerAvailable(p,G.year)){
        market.push({p:p,fromTeam:tid});
      }
    });
  });
  /* Filter */
  var visible=market.filter(function(m){
    var p=m.p;
    var passFilter=marketFilter==='all'||
      (marketFilter==='GK'&&p.pos==='GK')||
      (marketFilter==='DEF'&&['CB','LB','RB','LWB','RWB'].includes(p.pos))||
      (marketFilter==='MID'&&['CDM','CM','CAM','LM','RM'].includes(p.pos))||
      (marketFilter==='FWD'&&['LW','RW','ST','CF'].includes(p.pos));
    var passSearch=!marketSearch||p.name.toLowerCase().includes(marketSearch.toLowerCase());
    return passFilter&&passSearch;
  });
  visible.sort(function(a,b){return playerOvr(b.p,G.year)-playerOvr(a.p,G.year);});
  visible=visible.slice(0,40);

  var filters=['all','GK','DEF','MID','FWD'];
  var filtersHtml=filters.map(function(f){
    return '<button class="filter-btn'+(marketFilter===f?' active':'')+'" onclick="setMarketFilter(\''+f+'\')">'+f+'</button>';
  }).join('');

  var rows=visible.map(function(m){
    var p=m.p, o=playerOvr(p,G.year);
    var val=playerValue(p,G.year);
    var age=G.year-p.born;
    var canAfford=G.budget>=val;
    var ft=getTeam(m.fromTeam);
    return '<div class="market-player">'+
      '<div><span class="pos-badge '+posColor(p.pos)+'">'+p.pos+'</span></div>'+
      '<div class="mp-info">'+
        '<div class="mp-name">'+p.name+' <span class="ovr-pill" style="color:'+ovrColor(o)+';font-size:11px">'+o+'</span></div>'+
        '<div class="mp-meta">'+p.nat+' · '+age+'y · '+(ft?ft.name:'Free agent')+'</div>'+
      '</div>'+
      '<div class="mp-price">'+fmtMoney(val)+'</div>'+
      '<button class="btn-buy" '+(canAfford?'':'disabled')+' onclick="buyPlayer(\''+p.id+'\',\''+m.fromTeam+'\','+val+')">Buy</button>'+
    '</div>';
  }).join('');

  el.innerHTML='<div class="budget-bar"><div><div class="label">Transfer Budget</div><div class="amount">'+fmtMoney(G.budget)+'</div></div></div>'+
    '<div class="transfers-layout">'+
      '<div>'+
        '<h3 style="font-size:12px;color:var(--muted);margin-bottom:8px;text-transform:uppercase">Transfer Market</h3>'+
        '<div style="margin-bottom:8px"><input placeholder="Search player…" oninput="marketSearch=this.value;renderTransfers()" value="'+marketSearch+'"></div>'+
        '<div class="market-filters">'+filtersHtml+'</div>'+
        '<div class="scroll-area">'+rows+'</div>'+
      '</div>'+
      '<div>'+
        '<h3 style="font-size:12px;color:var(--muted);margin-bottom:8px;text-transform:uppercase">My Squad</h3>'+
        renderSquadMiniList()+
      '</div>'+
    '</div>';
}
function renderSquadMiniList(){
  var sq=G.squads[G.team];
  sq=sq.slice().sort(function(a,b){return playerOvr(b,G.year)-playerOvr(a,G.year);});
  return '<div class="bench-list scroll-area">'+sq.map(function(p){
    var o=playerOvr(p,G.year);
    return '<div class="bench-item">'+
      '<span class="pos-badge '+posColor(p.pos)+'">'+p.pos+'</span>'+
      '<span class="bi-name">'+p.name+'</span>'+
      '<span class="bi-ovr" style="color:'+ovrColor(o)+'">'+o+'</span>'+
      '<button class="btn-sell" style="margin-left:auto" onclick="trySell(\''+p.id+'\')">Sell</button>'+
    '</div>';
  }).join('')+'</div>';
}
function setMarketFilter(f){marketFilter=f;renderTransfers();}
function buyPlayer(pid, fromTeam, val){
  var p=G.squads[fromTeam].find(function(x){return x.id===pid;});
  if(!p||G.budget<val) return;
  G.budget-=val;
  G.squads[fromTeam]=G.squads[fromTeam].filter(function(x){return x.id!==pid;});
  p.club=G.team;
  G.squads[G.team].push(p);
  saveGame();updateHubBar();renderTransfers();
  showModal('<h2>Transfer Complete</h2><p class="sub"><strong>'+p.name+'</strong> has joined for '+fmtMoney(val)+'.<br>Remaining budget: '+fmtMoney(G.budget)+'</p><div class="modal-actions"><button class="btn-confirm" onclick="closeModal()">OK</button></div>');
}
function trySell(pid){
  var p=G.squads[G.team].find(function(x){return x.id===pid;});
  if(!p) return;
  var val=playerValue(p,G.year);
  showModal('<h2>Sell Player</h2><p class="sub">Sell <strong>'+p.name+'</strong> for '+fmtMoney(val)+'?</p>'+
    '<div class="modal-actions">'+
      '<button class="btn-cancel" onclick="closeModal()">Cancel</button>'+
      '<button class="btn-confirm" onclick="confirmSell(\''+pid+'\','+val+')">Confirm Sale</button>'+
    '</div>');
}
function confirmSell(pid,val){
  G.squads[G.team]=G.squads[G.team].filter(function(p){return p.id!==pid;});
  G.lineups[G.team]=G.lineups[G.team].filter(function(l){return l.pid!==pid;});
  G.budget+=val;
  saveGame();closeModal();updateHubBar();renderTransfers();
}

/* --- Fixtures tab --- */
function renderFixtures(){
  var el=document.getElementById('tab-fixtures');
  var myFix=G.fixtures.filter(function(f){return f.home===G.team||f.away===G.team;});
  var items=myFix.map(function(f,i){
    var isH=f.home===G.team;
    var opp=getTeam(isH?f.away:f.home);
    var res=f.result;
    var r=myResult(f);
    var cls=res?(r==='w'?'win':r==='d'?'draw':'loss'):(G.fixtures.indexOf(f)===G.week?'current':'');
    var scoreHtml=res?'<span class="fi-score" style="color:'+(r==='w'?'var(--primary)':r==='d'?'var(--yellow)':'var(--red)')+'">'+
      (isH?res.hg:res.ag)+' - '+(isH?res.ag:res.hg)+'</span>':'';
    var btnHtml=!res?'<button class="fi-btn" onclick="openMatchScreen(\''+f.home+'\',\''+f.away+'\','+G.fixtures.indexOf(f)+')">Play</button>':'';
    return '<div class="fixture-item '+cls+'">'+
      '<span class="fi-gw">GW'+f.gw+'</span>'+
      '<span class="fi-teams">'+(isH?'<span style="color:var(--primary)">'+getTeam(G.team).name+'</span>':''+getTeam(G.team).name)+' vs '+opp.name+'<span class="venue">'+(isH?'H':'A')+'</span></span>'+
      scoreHtml+btnHtml+
    '</div>';
  }).join('');
  el.innerHTML='<div class="fixtures-list">'+items+'</div>';
}

/* --- Table tab --- */
function renderTable(){
  var el=document.getElementById('tab-table');
  var teams=leagueTeams(G.league);
  var rows=teams.map(function(t){
    var e=G.table[t.id]||{w:0,d:0,l:0,gf:0,ga:0,pts:0};
    return {id:t.id,name:t.name,e:e,gd:e.gf-e.ga};
  });
  rows.sort(function(a,b){return b.e.pts-a.e.pts||(b.gd-a.gd)||b.e.gf-a.e.gf;});
  var n=teams.length;
  var clSpots=4,elSpots=2,relSpots=3;
  var html=rows.map(function(r,i){
    var pos=i+1;
    var zone=pos<=clSpots?'qual-cl':pos<=clSpots+elSpots?'qual-el':pos>n-relSpots?'rel-zone':'';
    var isMe=r.id===G.team;
    var played=r.e.w+r.e.d+r.e.l;
    return '<tr class="'+(isMe?'my-team':'')+' '+zone+'">'+
      '<td>'+pos+'</td>'+
      '<td>'+r.name+'</td>'+
      '<td>'+played+'</td>'+
      '<td>'+r.e.w+'</td>'+
      '<td>'+r.e.d+'</td>'+
      '<td>'+r.e.l+'</td>'+
      '<td>'+r.e.gf+'</td>'+
      '<td>'+r.e.ga+'</td>'+
      '<td>'+(r.gd>=0?'+':'')+r.gd+'</td>'+
      '<td class="pts-cell">'+r.e.pts+'</td>'+
    '</tr>';
  }).join('');
  el.innerHTML='<div class="card"><table class="league-table">'+
    '<thead><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead>'+
    '<tbody>'+html+'</tbody></table></div>'+
    '<div style="margin-top:8px;font-size:11px;color:var(--muted);display:flex;gap:16px">'+
      '<span><span style="display:inline-block;width:10px;height:10px;background:var(--blue);border-radius:2px;margin-right:4px"></span>Champions League</span>'+
      '<span><span style="display:inline-block;width:10px;height:10px;background:var(--yellow);border-radius:2px;margin-right:4px"></span>Europa League</span>'+
      '<span><span style="display:inline-block;width:10px;height:10px;background:var(--red);border-radius:2px;margin-right:4px"></span>Relegation</span>'+
    '</div>';
}

/* =====================================================================
   MATCH SCREEN
   ===================================================================== */
var _matchIdx = -1;
var _matchSim = null;
var _matchEventIdx = 0;
var _simTimer = null;

function openMatchScreen(homeId, awayId, fixIdx){
  _matchIdx = fixIdx;
  var hTeam=getTeam(homeId), aTeam=getTeam(awayId);
  document.getElementById('match-home-name').textContent=hTeam.name;
  document.getElementById('match-away-name').textContent=aTeam.name;
  document.getElementById('match-home-score').textContent='0';
  document.getElementById('match-away-score').textContent='0';
  document.getElementById('match-time').textContent="0'";
  document.getElementById('commentary-feed').innerHTML='';
  document.getElementById('btn-sim-live').style.display='';
  document.getElementById('btn-match-end').style.display='none';
  document.getElementById('btn-sim-live').textContent='▶ Simulate';

  renderMatchStats({hPoss:50,aPoss:50,hShots:0,aShots:0,hSOT:0,aSOT:0,hxG:'0.0',axG:'0.0',hg:0,ag:0});

  _matchSim = simulateMatch(homeId, awayId, {live:true});
  _matchEventIdx=0;
  showScreen('match');
}

function simLiveNext(){
  if(!_matchSim||!_matchSim.events) return;
  var btn=document.getElementById('btn-sim-live');
  btn.disabled=true;
  btn.textContent='Simulating…';
  if(_simTimer) clearInterval(_simTimer);

  _simTimer=setInterval(function(){
    if(_matchEventIdx>=_matchSim.events.length){
      clearInterval(_simTimer);
      finishMatch();
      return;
    }
    var ev=_matchSim.events[_matchEventIdx++];
    appendComment(ev);
    document.getElementById('match-home-score').textContent=ev.scoreH;
    document.getElementById('match-away-score').textContent=ev.scoreA;
    document.getElementById('match-time').textContent=ev.min+"'";
    renderMatchStats({
      hPoss:_matchSim.stats.hPoss,aPoss:_matchSim.stats.aPoss,
      hShots:_matchSim.stats.hShots,aShots:_matchSim.stats.aShots,
      hSOT:_matchSim.stats.hSOT,aSOT:_matchSim.stats.aSOT,
      hxG:_matchSim.stats.hxG,axG:_matchSim.stats.axG,
      hg:ev.scoreH,ag:ev.scoreA,
    });
  }, 350);
}

function appendComment(ev){
  var feed=document.getElementById('commentary-feed');
  var isGoal=ev.type==='goal_h'||ev.type==='goal_a';
  var div=document.createElement('div');
  div.className='comment-item'+(isGoal?' goal':ev.type==='save'?' save':'');
  div.innerHTML='<span class="min">'+ev.min+"'</span><span class='text'>"+ev.html+'</span>';
  feed.insertBefore(div,feed.firstChild);
}

function renderMatchStats(s){
  var hp=s.hPoss, ap=s.aPoss;
  document.getElementById('match-stats-panel').innerHTML=
    '<div class="card">'+
    matchStatRow('Possession',''+hp+'%',''+ap+'%','<div class="poss-bar"><div class="home" style="width:'+hp+'%"></div><div class="away" style="width:'+ap+'%"></div></div>')+
    matchStatRow('Shots',''+s.hShots,''+s.aShots,'')+
    matchStatRow('On Target',''+s.hSOT,''+s.aSOT,'')+
    matchStatRow('xG',''+s.hxG,''+s.axG,'')+
    '</div>';
}
function matchStatRow(lbl,hv,av,barHtml){
  return '<div class="match-stat-row">'+
    '<div class="labels"><span class="val home">'+hv+'</span><span class="lbl">'+lbl+'</span><span class="val away">'+av+'</span></div>'+
    (barHtml||'<div class="xg-bar"><div class="xg-fill" style="width:'+Math.min(100,parseFloat(hv)/(parseFloat(hv)+parseFloat(av)||1)*100)+'%"></div></div>')+
  '</div>';
}

function finishMatch(){
  var fix=G.fixtures[_matchIdx];
  var s=_matchSim.stats;
  fix.result={hg:s.hg,ag:s.ag};
  /* Update tables */
  updateTableEntry(fix.home,fix.away,s.hg,s.ag);
  /* Advance week pointer */
  while(G.week<G.fixtures.length && G.fixtures[G.week].result) G.week++;
  /* Auto-sim AI vs AI matches up to next MY match */
  autoSimUntilMyNextMatch();
  saveGame();
  document.getElementById('btn-sim-live').style.display='none';
  document.getElementById('btn-skip-result').style.display='none';
  document.getElementById('btn-match-end').style.display='';
}

function updateTableEntry(homeId,awayId,hg,ag){
  function e(id){if(!G.table[id])G.table[id]={w:0,d:0,l:0,gf:0,ga:0,pts:0};return G.table[id];}
  var h=e(homeId),a=e(awayId);
  h.gf+=hg;h.ga+=ag;a.gf+=ag;a.ga+=hg;
  if(hg>ag){h.w++;h.pts+=3;a.l++;}
  else if(hg===ag){h.d++;h.pts+=1;a.d++;a.pts+=1;}
  else{a.w++;a.pts+=3;h.l++;}
}

function autoSimUntilMyNextMatch(){
  /* Sim all fixtures before the next MY match that don't have results yet,
     grouped by gameweek */
  var myFix=G.fixtures.filter(function(f){return f.home===G.team||f.away===G.team;});
  var nextMy=myFix.find(function(f){return !f.result;});
  var stopGw=nextMy?nextMy.gw:999;
  G.fixtures.forEach(function(f){
    if(f.result) return;
    if(f.gw>=stopGw) return;
    /* Sim instantly */
    var res=simulateMatch(f.home,f.away,{live:false});
    f.result={hg:res.hg,ag:res.ag};
    updateTableEntry(f.home,f.away,res.hg,res.ag);
  });
}

function endMatch(){
  showScreen('hub');
  updateHubBar();
  showTab('overview');
}

/* --- Instant result option (skip commentary) --- */
function instantResult(){
  if(!_matchSim) return;
  if(_simTimer) clearInterval(_simTimer);
  var s=_matchSim.stats;
  document.getElementById('match-home-score').textContent=s.hg;
  document.getElementById('match-away-score').textContent=s.ag;
  document.getElementById('match-time').textContent="90'";
  renderMatchStats(s);
  finishMatch();
}

/* =====================================================================
   MODAL
   ===================================================================== */
function showModal(html){
  document.getElementById('modal').innerHTML=html;
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal(){
  document.getElementById('modal-bg').classList.remove('open');
}

/* =====================================================================
   SAVE / LOAD
   ===================================================================== */
var SAVE_KEY='fm_save_v1';
function saveGame(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({
    league:G.league,team:G.team,year:G.year,
    squads:G.squads,formations:G.formations,lineups:G.lineups,
    budget:G.budget,fixtures:G.fixtures,week:G.week,table:G.table,
  }));}catch(e){}
}
function loadGame(){
  try{
    var data=JSON.parse(localStorage.getItem(SAVE_KEY));
    if(!data) return;
    Object.assign(G,data);
    autoSimUntilMyNextMatch();
    showScreen('hub');
    updateHubBar();
    showTab('overview');
  }catch(e){}
}

/* =====================================================================
   INIT
   ===================================================================== */
(function(){
  /* Show continue button if save exists */
  if(localStorage.getItem(SAVE_KEY)){
    document.getElementById('save-badge').style.display='';
  }
  /* Wire match screen skip button */
  document.getElementById('btn-sim-live').addEventListener('contextmenu',function(e){
    e.preventDefault();instantResult();
  });
})();
</script>
